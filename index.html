<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087765">
<title>Zimanem · واژگان</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zimanem">
<style>
:root{--green:#087765;--green-dark:#073f3c;--mint:#edf7f4;--muted:#6c8798;--line:#e4ebee;--paper:#fff;--page:#f7f9f9;--shadow:0 14px 35px rgba(22,54,56,.075)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--green-dark);font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:#fff;padding:18px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;padding-top:calc(18px + env(safe-area-inset-top))}
.status{height:20px;display:flex;justify-content:space-between;direction:ltr;color:#172f31;font:600 13px Arial}
.top{display:grid;grid-template-columns:42px 1fr 62px;align-items:center;text-align:center}
.back{border:0;background:none;font-size:30px;color:var(--green-dark);cursor:pointer}
.brand{font:600 32px Georgia,serif;direction:ltr}
.subtitle{color:var(--muted);margin-top:4px;font-size:17px}
.level{border-radius:22px;background:var(--mint);padding:12px 0;font-weight:700;color:var(--green);direction:ltr}
.progress-row{display:flex;align-items:center;gap:14px;direction:ltr;color:#526f7f;font-size:14px}
.track{height:7px;border-radius:9px;background:#e9eef0;flex:1;overflow:hidden}
.fill{height:100%;width:20%;background:var(--green);border-radius:9px;transition:width .2s}
.card{position:relative;border:1px solid #f0f3f3;border-radius:28px;box-shadow:var(--shadow);padding:20px 22px 16px;flex:1;display:flex;flex-direction:column;min-height:600px}
.bookmark{position:absolute;top:22px;left:22px;border:0;background:white;color:var(--green);font-size:26px;cursor:pointer}
.art{height:270px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain}
.word-row{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:12px;direction:ltr;margin-top:0}
.sound{width:58px;height:58px;border:0;border-radius:50%;background:var(--green);color:white;font-size:26px;cursor:pointer;display:grid;place-items:center}
.word{font:700 clamp(42px,11vw,58px) Georgia,serif;line-height:1.05;color:#082f31}
.accents{display:flex;gap:6px;align-self:start}
.accent{border:1px solid var(--line);background:#fff;border-radius:24px;padding:10px 11px;font-size:13px;color:#59717f;cursor:pointer;white-space:nowrap}
.accent.active{border:1.5px solid var(--green);color:var(--green);background:#fbfefd}
.ipa{direction:ltr;text-align:left;margin:6px 0 0 72px;font-size:22px;color:var(--muted);font-family:Arial,sans-serif}
.translation{font-size:31px;font-weight:700;margin:26px 0 12px 72px;text-align:left}
.meta{display:flex;align-items:center;gap:10px;margin-left:72px;color:var(--muted);font-size:14px}
.pill{background:var(--mint);padding:7px 14px;border-radius:22px;color:#285e58;direction:ltr}
.example{border-top:1px solid var(--line);margin-top:26px;padding:22px 0 12px;display:flex;gap:14px;direction:ltr}
.example-mark{width:6px;min-width:6px;background:#078d77;border-radius:8px}
.example-text{font:24px/1.4 Georgia,serif;color:#153437}
.example-text strong{color:var(--green)}
.example-fa{font:16px/1.8 Tahoma,Arial,sans-serif;color:var(--muted);text-align:right;margin-top:6px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:20px}
.tool{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;font:14px Tahoma;cursor:pointer;padding:8px 0}
.tool-icon{width:50px;height:50px;border-radius:50%;background:#f4f9f7;color:var(--green);display:grid;place-items:center;font-size:22px}
.tool.active .tool-icon{background:#dff2eb;box-shadow:inset 0 0 0 1px #a5d8c8}
.nav{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin-top:0;direction:ltr}
.nav-btn{width:60px;height:60px;border:0;border-radius:50%;background:#f0f7f5;color:#073f3c;font-size:30px;cursor:pointer}
.dots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dot{width:11px;height:11px;background:#cbd3d8;border-radius:50%;border:0;padding:0;cursor:pointer}
.dot.active{background:var(--green)}
.toast{min-height:18px;text-align:center;color:var(--green);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:520px){body{padding:18px 0}.app{border-radius:36px;box-shadow:0 12px 45px #173b3b12;min-height:calc(100dvh - 36px)}}
@media(max-height:800px){.app{gap:10px;padding-top:12px}.art{height:220px}.card{min-height:0;padding:15px 18px}.translation{margin-top:16px}.example{margin-top:18px;padding-top:16px}.nav-btn{width:48px;height:48px}}
</style>
</head>
<body>
<main class="app">
  <div class="status"><span>9:41</span><span aria-hidden="true">▮▮▮　◉　▰</span></div>

  <header class="top">
    <button class="back" aria-label="بازگشت" onclick="notify('بازگشت به فهرست درس‌ها')">‹</button>
    <div>
      <div class="brand">Zimanem</div>
      <div class="subtitle">واژگان</div>
    </div>
    <div class="level">A1</div>
  </header>

  <div class="progress-row">
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <span id="progressText">1 / 5</span>
  </div>

  <section class="card" aria-label="کارت واژگان">
    <button class="bookmark" id="bookmark" aria-label="ذخیره واژه" title="ذخیره واژه">♧</button>

    <div class="art"><img src="assets/apple-card.png" alt="تصویر سیب" id="wordImage"></div>

    <div class="word-row">
      <button class="sound" id="mainAudio" aria-label="پخش تلفظ انگلیسی">◖))</button>
      <div class="word" id="word">apple</div>
      <div class="accents">
        <button class="accent active" data-accent="us">🇺🇸 US</button>
        <button class="accent" data-accent="uk">🇬🇧 UK</button>
      </div>
    </div>

    <div class="ipa" id="ipa">/ˈæp.əl/</div>
    <div class="translation" id="translation">سیب</div>
    <div class="meta"><span class="pill" id="part">noun</span><span id="partFa">(اسم)</span></div>

    <div class="example">
      <div class="example-mark"></div>
      <div>
        <div class="example-text" id="example">I eat an <strong>apple</strong> every day.</div>
        <div class="example-fa" id="exampleFa">من هر روز یک سیب می‌خورم.</div>
      </div>
    </div>

    <div class="tools">
      <button class="tool" id="examplesBtn"><span class="tool-icon">▤</span><span>مثال‌های بیشتر</span></button>
      <button class="tool" id="reviewBtn"><span class="tool-icon">◉</span><span>مرور</span></button>
      <button class="tool" id="learnedBtn"><span class="tool-icon">♧</span><span>یادآوری</span></button>
    </div>
  </section>

  <div class="nav">
    <button class="nav-btn" id="prev" aria-label="واژه قبلی">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next" aria-label="واژه بعدی">›</button>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>
</main>

<script>
const words = [
  { word:'apple', ipa:'/ˈæp.əl/', fa:'سیب', part:'noun', partFa:'اسم', example:'I eat an <strong>apple</strong> every day.', exampleFa:'من هر روز یک سیب می‌خورم.', img:'assets/apple-card.png' },
  { word:'book', ipa:'/bʊk/', fa:'کتاب', part:'noun', partFa:'اسم', example:'I read a <strong>book</strong> before bed.', exampleFa:'من پیش از خواب کتاب می‌خوانم.', img:'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=800&q=85' },
  { word:'arrive', ipa:'/əˈraɪv/', fa:'رسیدن', part:'verb', partFa:'فعل', example:'We <strong>arrive</strong> at school at eight.', exampleFa:'ما ساعت هشت به مدرسه می‌رسیم.', img:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=85' },
  { word:'beautiful', ipa:'/ˈbjuː.tɪ.fəl/', fa:'زیبا', part:'adjective', partFa:'صفت', example:'The garden is <strong>beautiful</strong> in spring.', exampleFa:'باغ در بهار زیباست.', img:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=85' },
  { word:'run', ipa:'/rʌn/', fa:'دویدن', part:'verb', partFa:'فعل', example:'I <strong>run</strong> in the park every morning.', exampleFa:'من هر صبح در پارک می‌دوم.', img:'https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=800&q=85' }
];

let idx = 0;
let accent = 'us';
const saved = new Set(loadLS('saved', []));
const learned = new Set(loadLS('learned', []));

const $ = id => document.getElementById(id);

function loadLS(key, fallback){
  try {
    const raw = localStorage.getItem('zimanem:' + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveLS(key, value){
  try { localStorage.setItem('zimanem:' + key, JSON.stringify(value)); } catch (e) {}
}
function persist(){
  saveLS('saved', [...saved]);
  saveLS('learned', [...learned]);
}

function notify(s){ $('toast').textContent = s; }

function speak(text){
  if (!('speechSynthesis' in window)) {
    notify('پخش صوت در این مرورگر پشتیبانی نمی‌شود.');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = accent === 'us' ? 'en-US' : 'en-GB';
  u.rate = 0.88;
  speechSynthesis.speak(u);
  notify('تلفظ ' + (accent === 'us' ? 'آمریکایی' : 'بریتانیایی') + ' در حال پخش است');
}

function render(){
  const w = words[idx];
  $('word').textContent = w.word;
  $('ipa').textContent = w.ipa;
  $('translation').textContent = w.fa;
  $('part').textContent = w.part;
  $('partFa').textContent = '(' + w.partFa + ')';
  $('example').innerHTML = w.example;
  $('exampleFa').textContent = w.exampleFa;
  $('wordImage').src = w.img;
  $('wordImage').alt = 'تصویر ' + w.fa;

  const total = words.length;
  $('progressText').textContent = (idx + 1) + ' / ' + total;
  $('progressFill').style.width = ((idx + 1) / total * 100) + '%';

  const isSaved = saved.has(w.word);
  $('bookmark').textContent = isSaved ? '▣' : '♧';
  $('bookmark').style.color = isSaved ? 'var(--green)' : 'var(--green-dark)';

  $('dots').innerHTML = words.map((_, i) =>
    `<button class="dot ${i === idx ? 'active' : ''}" aria-label="واژه ${i + 1}" data-index="${i}"></button>`
  ).join('');
  document.querySelectorAll('.dot').forEach(b => {
    b.onclick = () => { idx = +b.dataset.index; render(); };
  });

  $('learnedBtn').classList.toggle('active', learned.has(w.word));
}

$('mainAudio').onclick = () => speak(words[idx].word);

document.querySelectorAll('.accent').forEach(b => {
  b.onclick = () => {
    accent = b.dataset.accent;
    document.querySelectorAll('.accent').forEach(x => x.classList.toggle('active', x === b));
    notify('تلفظ ' + (accent === 'us' ? 'آمریکایی' : 'بریتانیایی') + ' انتخاب شد');
  };
});

$('prev').onclick = () => { idx = (idx - 1 + words.length) % words.length; render(); notify('واژه قبلی'); };
$('next').onclick = () => { idx = (idx + 1) % words.length; render(); notify('واژه بعدی'); };

$('bookmark').onclick = () => {
  const w = words[idx].word;
  saved.has(w) ? saved.delete(w) : saved.add(w);
  persist();
  render();
  notify(saved.has(w) ? 'به واژه‌های ذخیره‌شده افزوده شد' : 'از ذخیره‌ها برداشته شد');
};

$('learnedBtn').onclick = () => {
  const w = words[idx].word;
  learned.has(w) ? learned.delete(w) : learned.add(w);
  persist();
  render();
  notify(learned.has(w) ? 'برای مرور بعدی علامت‌گذاری شد' : 'علامت یادآوری برداشته شد');
};

$('reviewBtn').onclick = () => { idx = 0; render(); notify('مرور این مجموعه از ابتدا آغاز شد'); };
$('examplesBtn').onclick = () => notify('نمونه: I bought an apple. — من یک سیب خریدم.');

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW register failed:', err);
    });
  });
}
</script>
</body>
</html>
