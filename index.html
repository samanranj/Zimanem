<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087765">
<title>Zimanem · واژگان</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zimanem">
<style>
/* ============ متغیرهای رنگی (حالت روشن و تاریک) ============ */
:root {
  --bg-page: #f7f9f9;
  --bg-card: #ffffff;
  --text-main: #073f3c;
  --text-muted: #6c8798;
  --brand-green: #087765;
  --brand-light: #edf7f4;
  --border: #e4ebee;
  --shadow: 0 14px 35px rgba(22,54,56,.075);
  --overlay: rgba(255,255,255,0.85);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: #0f1719;
    --bg-card: #162225;
    --text-main: #e2f0ec;
    --text-muted: #7a969e;
    --brand-green: #10b69d;
    --brand-light: #1c3135;
    --border: #223235;
    --shadow: 0 14px 35px rgba(0,0,0,0.3);
    --overlay: rgba(22, 34, 37, 0.85);
  }
}

/* ============ پایه ============ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-page); color: var(--text-main);
  font-family: Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  transition: background 0.4s ease, color 0.4s ease;
}

.app {
  width: min(100%, 520px); min-height: 100dvh; margin: auto;
  background: var(--bg-card);
  padding: 18px 22px calc(22px + env(safe-area-inset-bottom));
  padding-top: calc(18px + env(safe-area-inset-top));
  display: flex; flex-direction: column; gap: 16px;
  transition: background 0.4s ease;
}

/* ============ هدر ============ */
.status { height: 20px; display: flex; justify-content: space-between; direction: ltr; font: 600 13px Arial; opacity: 0.7; }
.top { display: grid; grid-template-columns: 42px 1fr 62px; align-items: center; text-align: center; }
.back { border: 0; background: none; font-size: 30px; color: var(--text-main); cursor: pointer; transition: transform 0.2s; }
.back:active { transform: scale(0.8); }
.brand { font: 600 32px Georgia, serif; direction: ltr; letter-spacing: -0.5px; }
.subtitle { color: var(--text-muted); margin-top: 4px; font-size: 15px; }
.level { border-radius: 22px; background: var(--brand-light); padding: 8px 0; font-weight: 700; color: var(--brand-green); direction: ltr; font-size: 14px; }

/* ============ نوار پیشرفت ============ */
.progress-row { display: flex; align-items: center; gap: 14px; direction: ltr; color: var(--text-muted); font-size: 13px; font-weight: 600; }
.track { height: 6px; border-radius: 9px; background: var(--border); flex: 1; overflow: hidden; }
.fill { height: 100%; width: 5%; background: var(--brand-green); border-radius: 9px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

/* ============ کارت اصلی ============ */
.card {
  position: relative; border: 1px solid var(--border); border-radius: 28px;
  box-shadow: var(--shadow); padding: 20px 22px 16px; flex: 1;
  display: flex; flex-direction: column; min-height: 600px;
  background: var(--bg-card);
  transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

/* انیمیشن نرم برای تغییر محتوا */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.content-anim { animation: fadeSlideUp 0.35s ease-out forwards; }

.bookmark {
  position: absolute; top: 22px; left: 22px; border: 0; background: var(--bg-card);
  color: var(--brand-green); font-size: 26px; cursor: pointer; transition: transform 0.2s;
}
.bookmark:active { transform: scale(0.8); }

/* تصویر */
.art { height: 260px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
.art img { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.3s ease; }

/* کلمه و صدا */
.word-row { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 12px; direction: ltr; }

.sound {
  width: 58px; height: 58px; border: 0; border-radius: 50%;
  background: var(--brand-green); color: white; font-size: 26px;
  cursor: pointer; display: grid; place-items: center;
  transition: transform 0.2s, background 0.3s;
  box-shadow: 0 4px 15px rgba(8, 119, 101, 0.3);
}
.sound:active { transform: scale(0.85); }
.sound.playing { animation: pulse 1s infinite alternate; }
@keyframes pulse {
  from { box-shadow: 0 0 0 0 rgba(8, 119, 101, 0.4); }
  to { box-shadow: 0 0 0 15px rgba(8, 119, 101, 0); }
}

.word { font: 700 clamp(42px, 11vw, 58px) Georgia, serif; line-height: 1.05; color: var(--text-main); }

/* لهجه‌ها */
.accents { display: flex; gap: 6px; align-self: start; }
.accent {
  border: 1px solid var(--border); background: var(--bg-card); border-radius: 24px;
  padding: 8px 11px; font-size: 12px; color: var(--text-muted); cursor: pointer;
  white-space: nowrap; transition: all 0.2s;
}
.accent.active { border-color: var(--brand-green); color: var(--brand-green); background: var(--brand-light); }

/* تلفظ و ترجمه */
.ipa { direction: ltr; text-align: left; margin: 6px 0 0 72px; font-size: 20px; color: var(--text-muted); font-family: Arial, sans-serif; }
.translation { font-size: 32px; font-weight: 700; margin: 20px 0 10px 72px; text-align: left; color: var(--text-main); }
.meta { display: flex; align-items: center; gap: 10px; margin-left: 72px; color: var(--text-muted); font-size: 13px; }
.pill { background: var(--brand-light); padding: 6px 14px; border-radius: 22px; color: var(--brand-green); direction: ltr; font-weight: 600; }

/* مثال */
.example { border-top: 1px solid var(--border); margin-top: 20px; padding: 20px 0 10px; display: flex; gap: 14px; direction: ltr; }
.example-mark { width: 5px; min-width: 5px; background: var(--brand-green); border-radius: 8px; opacity: 0.8; }
.example-text { font: 22px/1.45 Georgia, serif; color: var(--text-main); text-align: left; }
.example-text strong { color: var(--brand-green); font-weight: 700; }
.example-fa { font: 15px/1.8 Tahoma, Arial, sans-serif; color: var(--text-muted); text-align: right; margin-top: 6px; direction: rtl; }

/* ابزارها */
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; padding-top: 20px; }
.tool { border: 0; background: transparent; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 8px; font: 13px Tahoma; cursor: pointer; padding: 8px 0; transition: color 0.2s; }
.tool-icon { width: 50px; height: 50px; border-radius: 50%; background: var(--brand-light); color: var(--brand-green); display: grid; place-items: center; font-size: 22px; transition: all 0.3s; }
.tool:active .tool-icon { transform: scale(0.9); }
.tool.active .tool-icon { background: var(--brand-green); color: white; box-shadow: 0 4px 12px rgba(8, 119, 101, 0.3); }

/* ناوبری پایین */
.nav { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; margin-top: 0; direction: ltr; }
.nav-btn {
  width: 60px; height: 60px; border: 0; border-radius: 50%;
  background: var(--brand-light); color: var(--brand-green); font-size: 30px;
  cursor: pointer; display: grid; place-items: center; transition: transform 0.2s;
}
.nav-btn:active { transform: scale(0.85); }
.dots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 10px; }
.dot { width: 8px; height: 8px; background: var(--border); border-radius: 50%; border: 0; padding: 0; cursor: pointer; transition: all 0.3s; }
.dot.active { background: var(--brand-green); transform: scale(1.4); }

/* پیام (Toast) */
.toast {
  min-height: 20px; text-align: center; color: var(--brand-green); font-size: 12px;
  opacity: 0; transition: opacity 0.3s; font-weight: 600;
}
.toast.show { opacity: 1; }

/* ریسپانسیو */
@media (min-width: 520px) { body { padding: 18px 0; } .app { border-radius: 36px; box-shadow: 0 12px 45px rgba(0,0,0,0.1); min-height: calc(100dvh - 36px); } }
@media (max-height: 800px) { .app { gap: 10px; padding-top: 12px; } .art { height: 200px; } .card { min-height: 0; padding: 15px 18px; } .translation { margin-top: 12px; } .example { margin-top: 14px; padding-top: 14px; } .nav-btn { width: 48px; height: 48px; } }
</style>
</head>
<body>
<main class="app">
  <div class="status"><span>9:41</span><span aria-hidden="true">▮▮▮　◉　▰</span></div>

  <header class="top">
    <button class="back" aria-label="بازگشت" onclick="notify('بازگشت به فهرست درس‌ها')">‹</button>
    <div>
      <div class="brand">Zimanem</div>
      <div class="subtitle">واژگان</div>
    </div>
    <div class="level">A1</div>
  </header>

  <div class="progress-row">
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <span id="progressText">1 / 20</span>
  </div>

  <section class="card" aria-label="کارت واژگان">
    <button class="bookmark" id="bookmark" aria-label="ذخیره واژه">♧</button>

    <div id="cardContent">
      <div class="art"><img src="" alt="تصویر واژه" id="wordImage"></div>

      <div class="word-row">
        <button class="sound" id="mainAudio" aria-label="پخش تلفظ انگلیسی">◖))</button>
        <div class="word" id="word"></div>
        <div class="accents">
          <button class="accent active" data-accent="us">🇺🇸 US</button>
          <button class="accent" data-accent="uk">🇬🇧 UK</button>
        </div>
      </div>

      <div class="ipa" id="ipa"></div>
      <div class="translation" id="translation"></div>
      <div class="meta"><span class="pill" id="part"></span><span id="partFa"></span></div>

      <div class="example">
        <div class="example-mark"></div>
        <div>
          <div class="example-text" id="example"></div>
          <div class="example-fa" id="exampleFa"></div>
        </div>
      </div>
    </div>

    <div class="tools">
      <button class="tool" id="examplesBtn"><span class="tool-icon">▤</span><span>مثال بیشتر</span></button>
      <button class="tool" id="reviewBtn"><span class="tool-icon">◉</span><span>مرور</span></button>
      <button class="tool" id="learnedBtn"><span class="tool-icon">♧</span><span>یادآوری</span></button>
    </div>
  </section>

  <div class="nav">
    <button class="nav-btn" id="prev" aria-label="واژه قبلی">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next" aria-label="واژه بعدی">›</button>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>
</main>

<script>
const words = [
  { word:'apple', ipa:'/ˈæp.əl/', fa:'سیب', part:'noun', partFa:'اسم', example:'I eat an <strong>apple</strong> every day.', exampleFa:'من هر روز یک سیب می‌خورم.', img:'assets/apple-card.png', extra:'She bought a red <strong>apple</strong>.' },
  { word:'book', ipa:'/bʊk/', fa:'کتاب', part:'noun', partFa:'اسم', example:'I read a <strong>book</strong> before bed.', exampleFa:'من پیش از خواب کتاب می‌خوانم.', img:'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=800&q=85', extra:'This <strong>book</strong> is very interesting.' },
  { word:'arrive', ipa:'/əˈraɪv/', fa:'رسیدن', part:'verb', partFa:'فعل', example:'We <strong>arrive</strong> at school at eight.', exampleFa:'ما ساعت هشت به مدرسه می‌رسیم.', img:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=85', extra:'They will <strong>arrive</strong> tomorrow morning.' },
  { word:'beautiful', ipa:'/ˈbjuː.tɪ.fəl/', fa:'زیبا', part:'adjective', partFa:'صفت', example:'The garden is <strong>beautiful</strong> in spring.', exampleFa:'باغ در بهار زیباست.', img:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=85', extra:'What a <strong>beautiful</strong> view!' },
  { word:'run', ipa:'/rʌn/', fa:'دویدن', part:'verb', partFa:'فعل', example:'I <strong>run</strong> in the park every morning.', exampleFa:'من هر صبح در پارک می‌دوم.', img:'https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=800&q=85', extra:'He can <strong>run</strong> very fast.' },
  { word:'water', ipa:'/ˈwɔː.tər/', fa:'آب', part:'noun', partFa:'اسم', example:'Please give me a glass of <strong>water</strong>.', exampleFa:'لطفاً یک لیوان آب به من بده.', img:'https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=800&q=85', extra:'I drink a lot of <strong>water</strong>.' },
  { word:'happy', ipa:'/ˈhæp.i/', fa:'خوشحال', part:'adjective', partFa:'صفت', example:'She is very <strong>happy</strong> today.', exampleFa:'او امروز خیلی خوشحال است.', img:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=85', extra:'I am <strong>happy</strong> to see you.' },
  { word:'eat', ipa:'/iːt/', fa:'خوردن', part:'verb', partFa:'فعل', example:'We <strong>eat</strong> lunch at 12 o’clock.', exampleFa:'ما ساعت ۱۲ ناهار می‌خوریم.', img:'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=85', extra:'Do you want to <strong>eat</strong> pizza?' },
  { word:'car', ipa:'/kɑːr/', fa:'ماشین', part:'noun', partFa:'اسم', example:'He drives a red <strong>car</strong>.', exampleFa:'او یک ماشین قرمز می‌راند.', img:'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=800&q=85', extra:'My <strong>car</strong> is very old.' },
  { word:'sleep', ipa:'/sliːp/', fa:'خوابیدن', part:'verb', partFa:'فعل', example:'I <strong>sleep</strong> for eight hours every night.', exampleFa:'من هر شب هشت ساعت می‌خوابم.', img:'https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=800&q=85', extra:'Babies <strong>sleep</strong> a lot.' },
  { word:'big', ipa:'/bɪɡ/', fa:'بزرگ', part:'adjective', partFa:'صفت', example:'They live in a <strong>big</strong> house.', exampleFa:'آن‌ها در یک خانه بزرگ زندگی می‌کنند.', img:'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=85', extra:'He has a <strong>big</strong> dog.' },
  { word:'friend', ipa:'/frend/', fa:'دوست', part:'noun', partFa:'اسم', example:'He is my best <strong>friend</strong>.', exampleFa:'او بهترین دوست من است.', img:'https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=85', extra:'She is a good <strong>friend</strong>.' },
  { word:'go', ipa:'/ɡoʊ/', fa:'رفتن', part:'verb', partFa:'فعل', example:'I <strong>go</strong> to work by bus.', exampleFa:'من با اتوبوس به سر کار می‌روم.', img:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=85', extra:'Let’s <strong>go</strong> to the park.' },
  { word:'city', ipa:'/ˈsɪt.i/', fa:'شهر', part:'noun', partFa:'اسم', example:'Tehran is a very big <strong>city</strong>.', exampleFa:'تهران یک شهر بسیار بزرگ است.', img:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=800&q=85', extra:'I love this <strong>city</strong>.' },
  { word:'fast', ipa:'/fæst/', fa:'سریع', part:'adjective', partFa:'صفت', example:'He is a <strong>fast</strong> runner.', exampleFa:'او یک دونده سریع است.', img:'https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=800&q=85', extra:'This car is very <strong>fast</strong>.' },
  { word:'house', ipa:'/haʊs/', fa:'خانه', part:'noun', partFa:'اسم', example:'Welcome to my <strong>house</strong>.', exampleFa:'به خانه من خوش آمدید.', img:'https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=800&q=85', extra:'They bought a new <strong>house</strong>.' },
  { word:'read', ipa:'/riːd/', fa:'خواندن', part:'verb', partFa:'فعل', example:'I like to <strong>read</strong> the news.', exampleFa:'من دوست دارم اخبار را بخوانم.', img:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=800&q=85', extra:'She can <strong>read</strong> English well.' },
  { word:'nice', ipa:'/naɪs/', fa:'خوب / قشنگ', part:'adjective', partFa:'صفت', example:'It is a <strong>nice</strong> day today.', exampleFa:'امروز روز خوبی است.', img:'https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=85', extra:'He is a <strong>nice</strong> person.' },
  { word:'food', ipa:'/fuːd/', fa:'غذا', part:'noun', partFa:'اسم', example:'Iranian <strong>food</strong> is delicious.', exampleFa:'غذای ایرانی خوشمزه است.', img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=85', extra:'I need to buy some <strong>food</strong>.' },
  { word:'write', ipa:'/raɪt/', fa:'نوشتن', part:'verb', partFa:'فعل', example:'Please <strong>write</strong> your name here.', exampleFa:'لطفاً نام خود را اینجا بنویسید.', img:'https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=85', extra:'I want to <strong>write</strong> a letter.' }
];

let idx = 0;
let accent = 'us';
const saved = new Set(loadLS('saved', []));
const learned = new Set(loadLS('learned', []));
const $ = id => document.getElementById(id);

function loadLS(key, fallback) { try { const raw = localStorage.getItem('zimanem:' + key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
function saveLS(key, value) { try { localStorage.setItem('zimanem:' + key, JSON.stringify(value)); } catch (e) {} }
function persist() { saveLS('saved', [...saved]); saveLS('learned', [...learned]); }

let toastTimeout;
function notify(s) {
  const t = $('toast');
  t.textContent = s;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
}

function speak(text) {
  if (!('speechSynthesis' in window)) { notify('پخش صوت در این مرورگر پشتیبانی نمی‌شود.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = accent === 'us' ? 'en-US' : 'en-GB';
  u.rate = 0.88;
  const btn = $('mainAudio');
  btn.classList.add('playing');
  u.onend = () => btn.classList.remove('playing');
  speechSynthesis.speak(u);
  notify('تلفظ ' + (accent === 'us' ? 'آمریکایی' : 'بریتانیایی') + ' در حال پخش است');
}

function render(animate = true) {
  const w = words[idx];
  const content = $('cardContent');
  
  if (animate) {
    content.classList.remove('content-anim');
    void content.offsetWidth; // Force reflow
    content.classList.add('content-anim');
  }

  $('word').textContent = w.word;
  $('ipa').textContent = w.ipa;
  $('translation').textContent = w.fa;
  $('part').textContent = w.part;
  $('partFa').textContent = '(' + w.partFa + ')';
  $('example').innerHTML = w.example;
  $('exampleFa').textContent = w.exampleFa;
  $('wordImage').src = w.img;
  $('wordImage').alt = 'تصویر ' + w.fa;

  const total = words.length;
  $('progressText').textContent = (idx + 1) + ' / ' + total;
  $('progressFill').style.width = ((idx + 1) / total * 100) + '%';

  const isSaved = saved.has(w.word);
  $('bookmark').textContent = isSaved ? '▣' : '♧';
  $('bookmark').style.color = isSaved ? 'var(--brand-green)' : 'var(--text-main)';

  $('dots').innerHTML = words.map((_, i) => `<button class="dot ${i === idx ? 'active' : ''}" aria-label="واژه ${i + 1}" data-index="${i}"></button>`).join('');
  document.querySelectorAll('.dot').forEach(b => {
    b.onclick = () => { idx = +b.dataset.index; render(); };
  });

  $('learnedBtn').classList.toggle('active', learned.has(w.word));
}

$('mainAudio').onclick = () => speak(words[idx].word);

document.querySelectorAll('.accent').forEach(b => {
  b.onclick = () => {
    accent = b.dataset.accent;
    document.querySelectorAll('.accent').forEach(x => x.classList.toggle('active', x === b));
    notify('تلفظ ' + (accent === 'us' ? 'آمریکایی' : 'بریتانیایی') + ' انتخاب شد');
  };
});

$('prev').onclick = () => { idx = (idx - 1 + words.length) % words.length; render(); };
$('next').onclick = () => { idx = (idx + 1) % words.length; render(); };

$('bookmark').onclick = () => {
  const w = words[idx].word;
  saved.has(w) ? saved.delete(w) : saved.add(w);
  persist(); render(false);
  notify(saved.has(w) ? 'به واژه‌های ذخیره‌شده افزوده شد' : 'از ذخیره‌ها برداشته شد');
};

$('learnedBtn').onclick = () => {
  const w = words[idx].word;
  learned.has(w) ? learned.delete(w) : learned.add(w);
  persist(); render(false);
  notify(learned.has(w) ? 'برای مرور بعدی علامت‌گذاری شد' : 'علامت یادآوری برداشته شد');
};

$('reviewBtn').onclick = () => { idx = 0; render(); notify('مرور این مجموعه از ابتدا آغاز شد'); };

$('examplesBtn').onclick = () => {
  const w = words[idx];
  if (w.extra) {
    $('example').innerHTML = w.extra;
    $('exampleFa').textContent = 'مثال بیشتر برای ' + w.fa;
    notify('مثال دوم نمایش داده شد');
  } else {
    notify('مثال بیشتری برای این واژه ثبت نشده است.');
  }
};

render(false);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err));
  });
}
</script>
</body>
</html>
